<!DOCTYPE html>
<html lang="zh-Hant">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>自行車社團 Nextron</title>

<style>

*{
    box-sizing:border-box;
}

body{
    font-family:Arial,sans-serif;
    margin:0;

    background-image:url("backg.jpg");
    background-size:cover;
    background-repeat:no-repeat;
    background-position:center;
    background-attachment:scroll;
}

img{
    max-width:100%;
    display:block;
}

header{
    background:#1e88e5;
    color:white;
    text-align:center;
    font-size:28px;
    font-weight:bold;

    padding-top:calc(20px + env(safe-area-inset-top));
    padding-bottom:20px;
    padding-left:20px;
    padding-right:20px;
}

.container{
    width:90%;
    max-width:1000px;
    margin:auto;
    padding:20px;
}

.section{
    background:white;
    padding:20px;
    margin-bottom:20px;
    border-radius:10px;
    box-shadow:0 2px 6px rgba(0,0,0,.15);
}

h1,h2,h3{
    margin-top:0;
}

h2{
    border-left:5px solid #1e88e5;
    padding-left:10px;
}

/* ===== 活動資訊 ===== */

.event-info{
    text-align:center;
}

.event-info h3{
    margin-bottom:10px;
}

.event-info p{
    margin:5px 0;
    font-size:18px;
}

/* ===== 活動圖片 ===== */

.img-box{
    width:100%;
    max-width:960px;
    margin:15px auto;
    overflow:hidden;
    border-radius:10px;
}

.img-box img{
    width:100%;
    height:auto;
}

/* ===== 按鈕 ===== */

.link-box{
    text-align:center;
    margin-top:15px;
}

.link-box a{
    display:inline-block;
    background:#1e88e5;
    color:white;
    text-decoration:none;
    padding:12px 20px;
    border-radius:8px;
    font-weight:bold;
    transition:.2s;
}

.link-box a:hover{
    background:#1565c0;
}

/* ===== Google Form ===== */

iframe{
    width:100%;
    height:650px;
    border:none;
}

/* ===== 名單 ===== */

#list ul{
    padding-left:20px;
    margin:0;
}

#list li{
    line-height:1.8;
    word-break:break-word;
}

/* ===== 相簿 ===== */

.photo-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(250px,1fr));
    gap:12px;
}

.photo-grid img{
    width:100%;
    border-radius:8px;
}

/* ===== 平板 ===== */

@media (max-width:768px){

    header{
        font-size:22px;
    }

    .container{
        width:95%;
        padding:10px;
    }

    .section{
        padding:15px;
    }

    iframe{
        height:550px;
    }

    .photo-grid{
        grid-template-columns:repeat(2,1fr);
    }

    .link-box a{
        width:100%;
    }

}

/* ===== 手機 ===== */

@media (max-width:430px){

    header{
        font-size:20px;
    }

    .container{
        width:98%;
        padding:5px;
    }

    .section{
        padding:12px;
    }

    h2{
        font-size:18px;
    }

    h3{
        font-size:17px;
    }

    .event-info p{
        font-size:15px;
    }

    iframe{
        height:500px;
    }

    .photo-grid{
        grid-template-columns:1fr;
    }

    #list li{
        font-size:14px;
    }

}

</style>
</head>

<body>

<header>
🚴‍♂️ 自行車社團 Nextron
</header>

<div class="container">

    <!-- 社團公告 -->

    <div class="section">
        <h2>此為自行車（人力、獸力行駛車輛）社團</h2>
        <h2>網站測試中</h2>
    </div>

    <!-- 活動發布 -->

    <div class="section">

        <div class="event-info">

            <h2>📅 活動發布</h2>

            <h3>淡水騎乘活動</h3>

            <p>集合時間</p>
            <p>07:30 社后橋</p>
            <p>08:00 彩虹橋</p>

        </div>

        <div class="img-box">
            <img src="2026001.jpg" alt="活動內容">
        </div>

        <div class="link-box">
            <a href="2026001.pptx" download>
                📥 下載活動簡報
            </a>
        </div>

    </div>

    <!-- 報名 -->

    <div class="section">

        <h2>📅 活動報名</h2>

        <iframe
            loading="lazy"
            allowfullscreen
            src="https://docs.google.com/forms/d/e/1FAIpQLSclQk2clsFossrjK8Qtw2B_hPNfuY7IZqnEdf_dXPY4c6SJdg/viewform?usp=dialog">
        </iframe>

    </div>

    <!-- 名單 -->

    <div class="section">

        <h2>👥 已報名名單</h2>

        <p>更新約需 1～2 分鐘（顯示最後 15 筆）</p>

        <div id="list">
            載入中...
        </div>

    </div>

    <!-- 照片 -->

    <div class="section">

        <h2>📸 活動照片</h2>

        <div class="photo-grid">

            <img src="PHOTOS/bike.png" alt="bike">

            <img src="PHOTOS/202601001.jpg" alt="photo">

            <img src="PHOTOS/202601005.jpg" alt="photo">

            <img src="PHOTOS/202601008.jpg" alt="photo">

        </div>

    </div>

    <!-- 留言板 -->

    <div class="section">

        <h2>💬 留言討論區</h2>

        <div class="commentbox"></div>

    </div>

</div>

<!-- 留言板 -->

<script src="https://unpkg.com/commentbox.io/dist/commentBox.min.js"></script>

<script>
commentBox('5671439357181952-proj');
</script>

<!-- Google Sheet 名單 -->

<script>

fetch("https://docs.google.com/spreadsheets/d/e/2PACX-1vRV3KnBxzMys3GoX1VukwyWQvQebGctp1r0_QqwIyZwMhTJqjcvvWrDwvV4FMdGnW0Qw5dNOR8knbqq/pub?output=csv")

.then(response => response.text())

.then(data => {

    let rows = data.trim().split("\n").slice(1);

    rows = rows.slice(-15);

    let html = "<ul>";

    rows.forEach(row => {

        let cols = row.split(",");

        let time = cols[0] || "";
        let name = cols[1] || "";
        let ppl = cols[2] || "";
        let comment = cols[3] || "";

        if(name){

            html += `
            <li>
                ${time} ｜ ${name} ｜ ${ppl} ｜ ${comment}
            </li>
            `;

        }

    });

    html += "</ul>";

    document.getElementById("list").innerHTML = html;

})

.catch(error => {

    document.getElementById("list").innerHTML =
    "名單載入失敗";

    console.error(error);

});

</script>

</body>
</html>
